components:
  schemas:
    Cliente:
      type: object
      required:
        - usuario
        - cedula
      properties:
        usuario:
          type: string
        cedula:
          type: string
        nombre:
          type: string
        celular:
          type: string
        correo:
          type: string
        rol:
          type: string
    Cliente_mscompra:
      type: object
      required:
        - usuario
        - cedula
      properties:
        usuario:
          type: string
        cedula:
          type: string
        nombre:
          type: string
        celular:
          type: string
        correo:
          type: string
        direccion:
          type: string
        rol:
          type: string
    Compra:
      type: object
      properties:
        numeroCompra:
          type: string
        idSubasta:
          type: string
        idBien:
          type: string
        descripcion:
          type: string
        cliente:
          "$ref": "#/components/schemas/Cliente_mscompra"
        valorOfertado:
          type: number
        estado:
          "$ref": "#/components/schemas/EstadoCompra"
        motivo:
          type: string
        intentosOfac:
          type: integer
        creadaEn:
          type: string
          format: date-time
    CompraIniciada:
      type: object
      properties:
        numeroCompra:
          type: string
        estado:
          "$ref": "#/components/schemas/EstadoCompra"
        mensaje:
          type: string
    Credenciales:
      type: object
      required:
        - usuario
        - clave
      properties:
        usuario:
          type: string
        clave:
          type: string
    CriterioSuscripcion:
      type: object
      required:
        - tipo
        - valor
      properties:
        tipo:
          type: string
        valor:
          type: string
    DatosCliente:
      type: object
      properties:
        usuario:
          type: string
        cedula:
          type: string
        nombre:
          type: string
        celular:
          type: string
        correo:
          type: string
        direccion:
          type: string
        rol:
          "$ref": "#/components/schemas/Rol"
    ErrorSpring:
      type: object
      description: Cuerpo por defecto de Spring Boot para una petición inválida.
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        path:
          type: string
    EstadoCompra:
      type: string
      enum:
        - CREADA
        - EN_VALIDACION
        - ESPERANDO_PAGO
        - PAGO_CONFIRMADO
        - TERMINADA
        - CANCELADA
        - EN_REVISION
    EstadoOferta:
      type: string
      enum:
        - REGISTRADA
        - SUPERADA
        - GANADORA
        - PERDEDORA
    EstadoSubasta:
      type: string
      enum:
        - PENDIENTE
        - PUBLICADA
        - LIBERADA
    EstadoSuscripcion:
      type: string
      enum:
        - ACTIVA
        - CANCELADA
    Oferta:
      type: object
      required:
        - valor
      properties:
        valor:
          type: number
          exclusiveMinimum: 0
    OfertaRegistrada:
      type: object
      properties:
        idOferta:
          type: integer
        idSubasta:
          type: string
        valor:
          type: number
        estado:
          "$ref": "#/components/schemas/EstadoOferta"
        mensaje:
          type: string
    PaginaCatalogo:
      type: object
      properties:
        contenido:
          type: array
          items:
            "$ref": "#/components/schemas/SubastaPublicada"
        pagina:
          type: integer
        tamano:
          type: integer
        total:
          type: integer
    Problema:
      type: object
      description: "Problem Details (RFC 9457)."
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        motivo:
          type: string
          description: Solo en el rechazo de ofertas de MSSubasta.
    Publicacion:
      type: object
      required:
        - idSubasta
      properties:
        idSubasta:
          type: string
    ReportePago:
      type: object
      required:
        - cedula
        - numeroCompra
        - valorPagado
        - credencial
      properties:
        cedula:
          type: string
        numeroCompra:
          type: string
        valorPagado:
          type: number
          exclusiveMinimum: 0
        credencial:
          type: string
    RespuestaAcceso:
      type: object
      properties:
        token:
          type: string
        expira:
          type: string
          format: date-time
        cliente:
          "$ref": "#/components/schemas/DatosCliente"
    ResultadoConciliacion:
      type: object
      required:
        - numeroCompra
        - resultado
      properties:
        numeroCompra:
          type: string
        resultado:
          type: string
        referenciaPago:
          type:
            - string
            - "null"
    Rol:
      type: string
      enum:
        - CLIENTE
        - ADMIN
    SubastaPublicada:
      type: object
      properties:
        idSubasta:
          type: string
        idBien:
          type: string
        descripcion:
          type: string
        categoria:
          type: string
        valorMinimo:
          type: number
        fechaInicio:
          type: string
          format: date-time
        fechaCierre:
          type: string
          format: date-time
        estado:
          "$ref": "#/components/schemas/EstadoSubasta"
    Suscripcion:
      type: object
      properties:
        idSuscripcion:
          type: string
          format: uuid
        cliente:
          "$ref": "#/components/schemas/Cliente"
        tipo:
          "$ref": "#/components/schemas/TipoSuscripcion"
        valor:
          type: string
        estado:
          "$ref": "#/components/schemas/EstadoSuscripcion"
        creadaEn:
          type: string
          format: date-time
    TipoSuscripcion:
      type: string
      enum:
        - NUEVAS_SUBASTAS
        - CAMBIOS_OFERTA
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token RS256 emitido por MSAcceso.
