  schemas:
    BienLiberado:
      type: object
      properties:
        idEvento:
          type: string
          format: uuid
        numeroCompra:
          type: string
        idSubasta:
          type: string
        motivo:
          type: string
    CambioOfertaMayor:
      type: object
      properties:
        idEvento:
          type: string
          format: uuid
        idSubasta:
          type: string
        descripcion:
          type: string
        valor:
          type: number
        cliente:
          "$ref": "#/components/schemas/Cliente"
        anterior:
          oneOf:
            - "$ref": "#/components/schemas/Cliente"
            - type: "null"
          description: Null si es la primera oferta.
    Cliente:
      type: object
      required:
        - usuario
        - cedula
      properties:
        usuario:
          type: string
        cedula:
          type: string
        nombre:
          type: string
        celular:
          type: string
        correo:
          type: string
        rol:
          type: string
    DespachoConfirmado:
