    Destinatario:
      type: object
      properties:
        nombre:
          type: string
        correo:
          type: string
        celular:
          type: string
    Destinatario_mspago:
      type: object
      properties:
        nombre:
          type:
            - string
            - "null"
        correo:
          type:
            - string
            - "null"
        celular:
          type:
            - string
            - "null"
    EnvioConfirmado:
      type: object
      properties:
        idEvento:
          type: string
          format: uuid
        numeroCompra:
          type: string
        fechaProgramada:
          type: string
          format: date
    EstadoSubasta:
      type: string
