# SSOWeb SERVER :80: solo archivos estáticos. /api/ lo atiende el BALANCEADOR DE CARGAS (observación 3).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'";
    }

    location / {
        try_files $uri /index.html;
    }
}
