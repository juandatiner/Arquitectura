# MSValidacion.jar · nodo MSValidacion SERVER :8087 · Máquina 2 · 10.43.100.238
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-2/.env).
server:
  port: 8087

spring:
  application:
    name: MSValidacion
  datasource:
    # DB VALIDAR (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}

sso:
  validacion:
    url-ofac: ${RUTA_OFAC}
    timeout-conexion: 2s
    timeout-respuesta: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
