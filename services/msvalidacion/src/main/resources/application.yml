# MSValidacion.jar · nodo MSValidacion SERVER :8087 · Máquina 2 · 10.43.100.238
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-2/.env).
server:
  port: 8087

spring:
  web:
    resources:
      # Sin esto, /webjars/** serviría los archivos de Swagger UI aunque esté desactivado
      add-mappings: false
  application:
    name: MSValidacion
  datasource:
    # DB VALIDAR (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}

sso:
  validacion:
    url-ofac: ${RUTA_OFAC}
    timeout-conexion: 2s
    timeout-respuesta: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI y Swagger UI cerrados: esta API no tiene autenticación propia en el puerto del servicio.
# Solo se abren con el perfil dev (application-dev.yml), que ningún despliegue de máquina activa.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# Logs JSON en consola; el correlationId sale como campo propio
logging:
  structured:
    format:
      console: logstash
