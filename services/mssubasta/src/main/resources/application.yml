# MSSubasta.jar · nodo MSSubasta SERVER :8083 · Máquina 2 · 10.43.100.238
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-N/.env).
server:
  port: 8083

spring:
  application:
    name: MSSubasta
  datasource:
    # DB SUBASTA (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  rabbitmq:
    # MOM SERVER :5672 (RabbitMQ) · Máquina 2
    host: ${MOM_HOST}
    port: 5672
    username: ${MOM_USUARIO}
    password: ${MOM_CLAVE}
    publisher-confirm-type: simple
    listener:
      simple:
        # Las colas se crean desde deploy/mom/definiciones/colas.json, no desde el código
        missing-queues-fatal: false
        prefetch: 10

sso:
  timers:
    apertura: 15s
    cierre: 15s
  outbox:
    intervalo: 1s
    tamano-lote: 50
    espera-confirmacion: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
