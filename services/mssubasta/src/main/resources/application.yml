# MSSubasta.jar · nodo MSSubasta SERVER :8083 · Máquina 2 · 10.43.100.238
server:
  port: ${PORT:8083}

spring:
  application:
    name: MSSubasta
  datasource:
    # DB SUBASTA (DB SERVER :5432)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/subasta}
    username: ${DB_USUARIO:subasta}
    password: ${DB_CLAVE:subasta}
  rabbitmq:
    # MOM SERVER :5672 (RabbitMQ) · Máquina 2
    host: ${MOM_HOST:localhost}
    port: ${MOM_PUERTO:5672}
    username: ${MOM_USUARIO:sso}
    password: ${MOM_CLAVE:sso}
    publisher-confirm-type: simple
    listener:
      simple:
        # Las colas se crean desde deploy/mom/definiciones/colas.json, no desde el código
        missing-queues-fatal: false
        prefetch: 10

sso:
  timers:
    apertura: ${TIMER_APERTURA:15s}
    cierre: ${TIMER_CIERRE:15s}
  outbox:
    intervalo: ${OUTBOX_INTERVALO:1s}
    tamano-lote: ${OUTBOX_TAMANO_LOTE:50}
    espera-confirmacion: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
