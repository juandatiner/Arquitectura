# SINBackEnd.jar · puerto 9002 · Máquina 3
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-3/.env).
server:
  port: 9002

spring:
  application:
    name: SINBackEnd
  datasource:
    # DB SIN (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  rabbitmq:
    # MOM SERVER :5672 (RabbitMQ · Máquina 2)
    host: ${MOM_HOST}
    port: 5672
    username: ${MOM_USUARIO}
    password: ${MOM_CLAVE}
    publisher-confirm-type: simple
    listener:
      simple:
        missing-queues-fatal: false
        prefetch: 10

sso:
  outbox:
    intervalo: 1s
    tamano-lote: 50
    espera-confirmacion: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
