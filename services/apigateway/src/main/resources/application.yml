# APIGateway.jar · nodo APIGATEWAY SERVER :8080 · Máquina 1 · 10.43.99.2 (DMZ)
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-N/.env).
server:
  port: 8080

spring:
  application:
    name: APIGateway

sso:
  # Flechas HTTP de SrvRuteo en el diagrama
  rutas:
    ms-acceso: ${RUTA_MSACCESO}
    ms-catalogo: ${RUTA_MSCATALOGO}
    ms-subasta: ${RUTA_MSSUBASTA}
    ms-suscripcion: ${RUTA_MSSUSCRIPCION}
    # Nginx (Máquina 1) · upstream msCompra least_conn → MSCompra réplica 1 (M2) y réplica 2 (M3)
    balanceador-compra: ${RUTA_BALANCEADOR_COMPRA}
    ms-pago: ${RUTA_MSPAGO}
  token:
    emisor: MSAcceso
    archivo-clave-publica: ${TOKEN_CLAVE_PUBLICA}
  credencial-yo-pago: ${CREDENCIAL_YOPAGO}
  timeout-conexion: 2s
  timeout-respuesta: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
