# MSSuscripcion.jar · nodo MSSuscripcion SERVER :8084 · Máquina 2 · 10.43.100.238
# Sin valores por defecto: todo llega por variables de entorno (deploy/maquina-2/.env).
server:
  port: 8084

spring:
  application:
    name: MSSuscripcion
  datasource:
    # DB Suscripcion (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  rabbitmq:
    # MOM SERVER :5672 (RabbitMQ)
    host: ${MOM_HOST}
    port: 5672
    username: ${MOM_USUARIO}
    password: ${MOM_CLAVE}
    publisher-confirm-type: simple
    listener:
      simple:
        # Las colas se crean desde deploy/mom/definiciones/colas.json, no desde el código
        missing-queues-fatal: false
        prefetch: 10

sso:
  suscripcion:
    zona-horaria: America/Bogota
  outbox:
    intervalo: 1s
    tamano-lote: 50
    espera-confirmacion: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
