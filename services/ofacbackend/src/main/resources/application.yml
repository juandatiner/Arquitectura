# OFACBackEnd.jar · nodo OFAC SERVER :9001 · Máquina 3 · 10.43.99.45 (sistema externo)
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-3/.env).
server:
  port: 9001

spring:
  web:
    resources:
      # Sin esto, /webjars/** serviría los archivos de Swagger UI aunque esté desactivado
      add-mappings: false
  application:
    name: OFACBackEnd
  datasource:
    # DB OFAC (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI y Swagger UI cerrados: esta API no tiene autenticación propia en el puerto del servicio.
# Solo se abren con el perfil dev (application-dev.yml), que ningún despliegue de máquina activa.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
