# MSAcceso.jar · nodo MSAcceso SERVER :8081 · Máquina 2 · 10.43.100.238
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-N/.env).
server:
  port: 8081

spring:
  application:
    name: MSAcceso
  datasource:
    # DB ACCESO (DB SERVER :5432)
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}

sso:
  ad:
    # AD SERVER :389 (OpenLDAP) · Máquina 3 · 10.43.99.45
    url: ${AD_URL}
    patron-dn: uid={0},ou=usuarios,dc=sso,dc=javeriana,dc=edu,dc=co
    timeout: 3s
  token:
    emisor: MSAcceso
    duracion: 30m
    archivo-clave-privada: ${TOKEN_CLAVE_PRIVADA}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
