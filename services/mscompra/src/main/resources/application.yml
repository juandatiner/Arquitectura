# MSCompra.jar · MSCompra SERVER réplica 1 :8085 (Máquina 2 · 10.43.100.238) y réplica 2 :8085 (Máquina 3 · 10.43.99.45)
# Sin valores por defecto de claves, hosts ni IP: llegan por variables de entorno (deploy/maquina-N/.env).
server:
  port: 8085

spring:
  web:
    resources:
      # Sin esto, /webjars/** serviría los archivos de Swagger UI aunque esté desactivado
      add-mappings: false
  application:
    name: MSCompra
  datasource:
    # DB COMPRA (DB SERVER :5432 · Máquina 2), compartida por las dos réplicas
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_CLAVE}
  rabbitmq:
    # MOM SERVER :5672 (RabbitMQ · Máquina 2)
    host: ${MOM_HOST}
    port: 5672
    username: ${MOM_USUARIO}
    password: ${MOM_CLAVE}
    publisher-confirm-type: simple
    listener:
      simple:
        missing-queues-fatal: false
        prefetch: 10

sso:
  compra:
    url-validacion: ${RUTA_MSVALIDACION}
    intervalo-validacion: 10s
    tamano-lote: 20
    reserva-validacion: 60s
    maximo-intentos-ofac: 8
    espera-inicial-ofac: 15s
    espera-maxima-ofac: 10m
    plazo-despacho: 30m
    timeout-conexion: 2s
    timeout-respuesta: 8s
  outbox:
    intervalo: 1s
    tamano-lote: 50
    espera-confirmacion: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI y Swagger UI cerrados: esta API no tiene autenticación propia en el puerto del servicio.
# Solo se abren con el perfil dev (application-dev.yml), que ningún despliegue de máquina activa.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
# Logs JSON en consola; el correlationId sale como campo propio
logging:
  structured:
    format:
      console: logstash
