# Entorno de desarrollo: todo el sistema en una sola máquina.
# Los nombres de servicio siguen los nodos del diagrama «Arquitectura Integrada JavaEE-.NET».
# Antes de levantar: cp deploy/dev/.env.example deploy/dev/.env (y llenar), tools/scripts/generar-claves-token.sh deploy/secretos,
# tools/scripts/generar-certificado-tls.sh deploy/secretos y python3 -I tools/scripts/generar-usuario-mom.py <usuario> <clave> deploy/secretos/mom.
# Después: cargar usuarios y subastas con tools/carga (ver tools/carga/README.md).
#   docker compose -f deploy/dev/docker-compose.yml up -d --build

name: sso-dev

services:
  # AD SERVER :389 (OpenLDAP) · Máquina 3
  ad:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: SSO Javeriana
      LDAP_DOMAIN: sso.javeriana.edu.co
      LDAP_ADMIN_PASSWORD: ${AD_ADMIN_CLAVE:?Falta AD_ADMIN_CLAVE en deploy/dev/.env}
    volumes:
      - ../ad/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports:
      - "${AD_PUERTO_HOST:-389}:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D cn=admin,dc=sso,dc=javeriana,dc=edu,dc=co -w \"$$LDAP_ADMIN_PASSWORD\""]
      interval: 5s
      retries: 20

  # MOM SERVER :5672 (RabbitMQ) · Máquina 2
  mom:
    image: rabbitmq:4.1-management-alpine
    # Usuario: python3 -I tools/scripts/generar-usuario-mom.py sso sso deploy/secretos/mom
    volumes:
      - ../mom/rabbitmq.conf:/etc/rabbitmq/conf.d/20-sso.conf:ro
      - ../mom/definiciones/colas.json:/etc/rabbitmq/definiciones/colas.json:ro
      - ../secretos/mom/usuarios.json:/etc/rabbitmq/definiciones/usuarios.json:ro
      - mom:/var/lib/rabbitmq
    ports:
      - "${MOM_PUERTO_HOST:-5672}:5672"
      - "${MOM_CONSOLA_PUERTO_HOST:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 20

  # DB SERVER :5432 · DB ACCESO · Máquina 2
  db-acceso:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acceso
      POSTGRES_USER: acceso
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-acceso:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceso -d acceso"]
      interval: 5s
      retries: 20

  # MSAcceso SERVER :8081 · MSAcceso.jar · Máquina 2
  msacceso:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msacceso
        ARTEFACTO: MSAcceso
        PUERTO: 8081
    environment:
      DB_URL: jdbc:postgresql://db-acceso:5432/acceso
      DB_USUARIO: acceso
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      AD_URL: ldap://ad:389
      TOKEN_CLAVE_PRIVADA: /run/secrets/token_privada
    secrets:
      - token_privada
    ports:
      - "${MSACCESO_PUERTO_HOST:-8081}:8081"
    depends_on:
      ad:
        condition: service_healthy
      db-acceso:
        condition: service_healthy

  # DB SERVER :5432 · DB CATALOGO · Máquina 2
  db-catalogo:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-catalogo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      retries: 20

  # MSCatalogo SERVER :8082 · MSCatalogo.jar · Máquina 2
  mscatalogo:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mscatalogo
        ARTEFACTO: MSCatalogo
        PUERTO: 8082
    environment:
      DB_URL: jdbc:postgresql://db-catalogo:5432/catalogo
      DB_USUARIO: catalogo
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSCATALOGO_PUERTO_HOST:-8082}:8082"
    depends_on:
      db-catalogo:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB SUBASTA · Máquina 2
  db-subasta:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subasta
      POSTGRES_USER: subasta
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-subasta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subasta -d subasta"]
      interval: 5s
      retries: 20

  # MSSubasta SERVER :8083 · MSSubasta.jar · Máquina 2
  mssubasta:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mssubasta
        ARTEFACTO: MSSubasta
        PUERTO: 8083
    environment:
      DB_URL: jdbc:postgresql://db-subasta:5432/subasta
      DB_USUARIO: subasta
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSSUBASTA_PUERTO_HOST:-8083}:8083"
    depends_on:
      db-subasta:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB Suscripcion · Máquina 2
  db-suscripcion:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suscripcion
      POSTGRES_USER: suscripcion
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-suscripcion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suscripcion -d suscripcion"]
      interval: 5s
      retries: 20

  # MSSuscripcion SERVER :8084 · MSSuscripcion.jar · Máquina 2
  mssuscripcion:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mssuscripcion
        ARTEFACTO: MSSuscripcion
        PUERTO: 8084
    environment:
      DB_URL: jdbc:postgresql://db-suscripcion:5432/suscripcion
      DB_USUARIO: suscripcion
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSSUSCRIPCION_PUERTO_HOST:-8084}:8084"
    depends_on:
      db-suscripcion:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB COMPRA · Máquina 2 (la comparten las dos réplicas)
  db-compra:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compra
      POSTGRES_USER: compra
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-compra:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compra -d compra"]
      interval: 5s
      retries: 20

  # MSCompra SERVER réplica 1 :8085 · MSCompra.jar · Máquina 2
  mscompra-replica1:
    build: &build-mscompra
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mscompra
        ARTEFACTO: MSCompra
        PUERTO: 8085
    environment:
      DB_URL: jdbc:postgresql://db-compra:5432/compra
      DB_USUARIO: compra
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      RUTA_MSVALIDACION: http://msvalidacion:8087
    depends_on: &depende-mscompra
      db-compra:
        condition: service_healthy
      mom:
        condition: service_healthy

  # MSCompra SERVER réplica 2 :8085 · MSCompra.jar · Máquina 3
  mscompra-replica2:
    build: *build-mscompra
    environment:
      DB_URL: jdbc:postgresql://db-compra:5432/compra
      DB_USUARIO: compra
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      RUTA_MSVALIDACION: http://msvalidacion:8087
    depends_on: *depende-mscompra

  # BALANCEADOR DE CARGAS :80 (Nginx) · Máquina 1 (DMZ)
  balanceador:
    image: nginx:1.29-alpine
    environment:
      SSOWEB: ssoweb:80
      APIGATEWAY: apigateway:8080
      MSCOMPRA_REPLICA1: mscompra-replica1:8085
      MSCOMPRA_REPLICA2: mscompra-replica2:8085
      RESOLVER: 127.0.0.11
    volumes:
      - ../balanceador/templates:/etc/nginx/templates:ro
      - ../secretos/balanceador.crt:/etc/nginx/tls/balanceador.crt:ro
      - ../secretos/balanceador.key:/etc/nginx/tls/balanceador.key:ro
    ports:
      - "${BALANCEADOR_PUERTO_HOST:-80}:80"
      - "${BALANCEADOR_HTTPS_PUERTO_HOST:-443}:443"
    depends_on:
      - apigateway

  # APIGATEWAY SERVER :8080 · APIGateway.jar · Máquina 1 (DMZ)
  apigateway:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: apigateway
        ARTEFACTO: APIGateway
        PUERTO: 8080
    environment:
      RUTA_MSACCESO: http://msacceso:8081
      RUTA_MSCATALOGO: http://mscatalogo:8082
      RUTA_MSSUBASTA: http://mssubasta:8083
      RUTA_MSSUSCRIPCION: http://mssuscripcion:8084
      RUTA_BALANCEADOR_COMPRA: http://balanceador:8085
      RUTA_MSPAGO: http://mspago:5086
      TOKEN_CLAVE_PUBLICA: /run/secrets/token_publica
      CREDENCIAL_YOPAGO: ${CREDENCIAL_YOPAGO:?Falta CREDENCIAL_YOPAGO en deploy/dev/.env}
    secrets:
      - token_publica
    ports:
      - "${APIGATEWAY_PUERTO_HOST:-8080}:8080"
    depends_on:
      msacceso:
        condition: service_healthy

secrets:
  token_publica:
    file: ../secretos/token_publica.pem
  token_privada:
    file: ../secretos/token_privada.pem

volumes:
  mom:
  db-catalogo:
  db-subasta:
  db-suscripcion:
  db-compra:
  db-acceso:
