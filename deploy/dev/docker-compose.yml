# Entorno de desarrollo: todo el sistema en una sola máquina.
# Los nombres de servicio siguen los nodos del diagrama «Arquitectura Integrada JavaEE-.NET».
# Antes de levantar: tools/scripts/generar-claves-token.sh deploy/secretos
#   docker compose -f deploy/dev/docker-compose.yml up -d --build

name: sso-dev

services:
  # AD SERVER :389 (OpenLDAP) · Máquina 3
  ad:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: SSO Javeriana
      LDAP_DOMAIN: sso.javeriana.edu.co
      LDAP_ADMIN_PASSWORD: ${AD_ADMIN_CLAVE:-admin}
    volumes:
      - ../ad/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    ports:
      - "${AD_PUERTO_HOST:-389}:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D uid=admin1,ou=usuarios,dc=sso,dc=javeriana,dc=edu,dc=co -w 'Admin1*'"]
      interval: 5s
      retries: 20

  # DB SERVER :5432 · DB ACCESO · Máquina 2
  db-acceso:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acceso
      POSTGRES_USER: acceso
      POSTGRES_PASSWORD: ${DB_CLAVE:-acceso}
    volumes:
      - db-acceso:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceso -d acceso"]
      interval: 5s
      retries: 20

  # MSAcceso SERVER :8081 · MSAcceso.jar · Máquina 2
  msacceso:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msacceso
        ARTEFACTO: MSAcceso
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://db-acceso:5432/acceso
      DB_USUARIO: acceso
      DB_CLAVE: ${DB_CLAVE:-acceso}
      AD_URL: ldap://ad:389
      TOKEN_CLAVE_PRIVADA: /run/secrets/token_privada
    secrets:
      - token_privada
    ports:
      - "${MSACCESO_PUERTO_HOST:-8081}:8081"
    depends_on:
      ad:
        condition: service_healthy
      db-acceso:
        condition: service_healthy

secrets:
  token_privada:
    file: ../secretos/token_privada.pem

volumes:
  db-acceso:
