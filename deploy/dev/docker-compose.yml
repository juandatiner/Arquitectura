# Entorno de desarrollo: todo el sistema en una sola máquina.
# Los nombres de servicio siguen los nodos del diagrama «Arquitectura Integrada JavaEE-.NET».
# Antes de levantar: cp deploy/dev/.env.example deploy/dev/.env (y llenar), tools/scripts/generar-claves-token.sh deploy/secretos,
# tools/scripts/generar-certificado-tls.sh deploy/secretos y python3 -I tools/scripts/generar-usuario-mom.py <usuario> <clave> deploy/secretos/mom.
# Después: cargar usuarios y subastas con tools/carga (ver tools/carga/README.md).
#   docker compose -f deploy/dev/docker-compose.yml up -d --build

name: sso-dev

services:
  # AD SERVER :389 (OpenLDAP) · Máquina 3
  ad:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_ORGANISATION: SSO Javeriana
      LDAP_DOMAIN: sso.javeriana.edu.co
      LDAP_ADMIN_PASSWORD: ${AD_ADMIN_CLAVE:?Falta AD_ADMIN_CLAVE en deploy/dev/.env}
    volumes:
      - ../ad/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      # Datos y configuración persistentes: sin esto el AD pierde los usuarios al recrear el contenedor
      - ad-datos:/var/lib/ldap
      - ad-config:/etc/ldap/slapd.d
    ports:
      - "${AD_PUERTO_HOST:-389}:389"
    healthcheck:
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D cn=admin,dc=sso,dc=javeriana,dc=edu,dc=co -w \"$$LDAP_ADMIN_PASSWORD\""]
      interval: 5s
      retries: 20

  # MOM SERVER :5672 (RabbitMQ) · Máquina 2
  mom:
    image: rabbitmq:4.1-management-alpine
    # Usuario: python3 -I tools/scripts/generar-usuario-mom.py sso sso deploy/secretos/mom
    volumes:
      - ../mom/rabbitmq.conf:/etc/rabbitmq/conf.d/20-sso.conf:ro
      - ../mom/definiciones/colas.json:/etc/rabbitmq/definiciones/colas.json:ro
      - ../secretos/mom/usuarios.json:/etc/rabbitmq/definiciones/usuarios.json:ro
      - mom:/var/lib/rabbitmq
    ports:
      - "${MOM_PUERTO_HOST:-5672}:5672"
      - "${MOM_CONSOLA_PUERTO_HOST:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 20

  # DB SERVER :5432 · DB ACCESO · Máquina 2
  db-acceso:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: acceso
      POSTGRES_USER: acceso
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-acceso:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acceso -d acceso"]
      interval: 5s
      retries: 20

  # MSAcceso SERVER :8081 · MSAcceso.jar · Máquina 2
  msacceso:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msacceso
        ARTEFACTO: MSAcceso
        PUERTO: 8081
    environment:
      DB_URL: jdbc:postgresql://db-acceso:5432/acceso
      DB_USUARIO: acceso
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      AD_URL: ldap://ad:389
      TOKEN_CLAVE_PRIVADA: /run/secrets/token_privada
    secrets:
      - token_privada
    ports:
      - "${MSACCESO_PUERTO_HOST:-8081}:8081"
    depends_on:
      ad:
        condition: service_healthy
      db-acceso:
        condition: service_healthy

  # DB SERVER :5432 · DB CATALOGO · Máquina 2
  db-catalogo:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-catalogo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      retries: 20

  # MSCatalogo SERVER :8082 · MSCatalogo.jar · Máquina 2
  mscatalogo:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mscatalogo
        ARTEFACTO: MSCatalogo
        PUERTO: 8082
    environment:
      DB_URL: jdbc:postgresql://db-catalogo:5432/catalogo
      DB_USUARIO: catalogo
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSCATALOGO_PUERTO_HOST:-8082}:8082"
    depends_on:
      db-catalogo:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB SUBASTA · Máquina 2
  db-subasta:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subasta
      POSTGRES_USER: subasta
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-subasta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subasta -d subasta"]
      interval: 5s
      retries: 20

  # MSSubasta SERVER :8083 · MSSubasta.jar · Máquina 2
  mssubasta:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mssubasta
        ARTEFACTO: MSSubasta
        PUERTO: 8083
    environment:
      DB_URL: jdbc:postgresql://db-subasta:5432/subasta
      DB_USUARIO: subasta
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSSUBASTA_PUERTO_HOST:-8083}:8083"
    depends_on:
      db-subasta:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB Suscripcion · Máquina 2
  db-suscripcion:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suscripcion
      POSTGRES_USER: suscripcion
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-suscripcion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suscripcion -d suscripcion"]
      interval: 5s
      retries: 20

  # MSSuscripcion SERVER :8084 · MSSuscripcion.jar · Máquina 2
  mssuscripcion:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mssuscripcion
        ARTEFACTO: MSSuscripcion
        PUERTO: 8084
    environment:
      DB_URL: jdbc:postgresql://db-suscripcion:5432/suscripcion
      DB_USUARIO: suscripcion
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    ports:
      - "${MSSUSCRIPCION_PUERTO_HOST:-8084}:8084"
    depends_on:
      db-suscripcion:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB COMPRA · Máquina 2 (la comparten las dos réplicas)
  db-compra:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: compra
      POSTGRES_USER: compra
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-compra:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compra -d compra"]
      interval: 5s
      retries: 20

  # MSCompra SERVER réplica 1 :8085 · MSCompra.jar · Máquina 2
  mscompra-replica1:
    build: &build-mscompra
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: mscompra
        ARTEFACTO: MSCompra
        PUERTO: 8085
    environment:
      DB_URL: jdbc:postgresql://db-compra:5432/compra
      DB_USUARIO: compra
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      RUTA_MSVALIDACION: http://msvalidacion:8087
    depends_on: &depende-mscompra
      db-compra:
        condition: service_healthy
      mom:
        condition: service_healthy

  # MSCompra SERVER réplica 2 :8085 · MSCompra.jar · Máquina 3
  mscompra-replica2:
    build: *build-mscompra
    environment:
      DB_URL: jdbc:postgresql://db-compra:5432/compra
      DB_USUARIO: compra
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      RUTA_MSVALIDACION: http://msvalidacion:8087
    depends_on: *depende-mscompra

  # DB SERVER :5432 · DB VALIDAR · Máquina 2
  db-validar:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: validar
      POSTGRES_USER: validar
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-validar:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validar -d validar"]
      interval: 5s
      retries: 20

  # MSValidacion SERVER :8087 · MSValidacion.jar · Máquina 2
  msvalidacion:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msvalidacion
        ARTEFACTO: MSValidacion
        PUERTO: 8087
    environment:
      DB_URL: jdbc:postgresql://db-validar:5432/validar
      DB_USUARIO: validar
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      RUTA_OFAC: http://ofacbackend:9001
    depends_on:
      db-validar:
        condition: service_healthy

  # DB SERVER :5432 · DB OFAC · Máquina 3
  db-ofac:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ofac
      POSTGRES_USER: ofac
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-ofac:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofac -d ofac"]
      interval: 5s
      retries: 20

  # OFAC SERVER :9001 · OFACBackEnd.jar · Máquina 3 (sistema externo)
  ofacbackend:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: ofacbackend
        ARTEFACTO: OFACBackEnd
        PUERTO: 9001
    environment:
      DB_URL: jdbc:postgresql://db-ofac:5432/ofac
      DB_USUARIO: ofac
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    depends_on:
      db-ofac:
        condition: service_healthy

  # DB SERVER :5432 · DB DESPACHO · Máquina 2
  db-despacho:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: despacho
      POSTGRES_USER: despacho
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-despacho:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U despacho -d despacho"]
      interval: 5s
      retries: 20

  # MSDespacho SERVER :8088 · MSDespacho.jar · Máquina 2
  msdespacho:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msdespacho
        ARTEFACTO: MSDespacho
        PUERTO: 8088
    environment:
      DB_URL: jdbc:postgresql://db-despacho:5432/despacho
      DB_USUARIO: despacho
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    depends_on:
      db-despacho:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB SIN · Máquina 3
  db-sin:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sin
      POSTGRES_USER: sin
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-sin:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sin -d sin"]
      interval: 5s
      retries: 20

  # SIN SERVER :9002 · SINBackEnd.jar · Máquina 3 (Sistema de Inventarios)
  sinbackend:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: sinbackend
        ARTEFACTO: SINBackEnd
        PUERTO: 9002
    environment:
      DB_URL: jdbc:postgresql://db-sin:5432/sin
      DB_USUARIO: sin
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    depends_on:
      db-sin:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB SEN · Máquina 3
  db-sen:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sen
      POSTGRES_USER: sen
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-sen:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sen -d sen"]
      interval: 5s
      retries: 20

  # SEN SERVER :9003 · SENBackEnd.jar · Máquina 3 (Sistema de Envíos)
  senbackend:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: senbackend
        ARTEFACTO: SENBackEnd
        PUERTO: 9003
    environment:
      DB_URL: jdbc:postgresql://db-sen:5432/sen
      DB_USUARIO: sen
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
    depends_on:
      db-sen:
        condition: service_healthy
      mom:
        condition: service_healthy

  # MAIL SERVER :1025 (SMTP) · Máquina 3 · CORREO. UI de los correos recibidos en :8025
  mail:
    image: axllent/mailpit:v1.27
    environment:
      MP_DATABASE: /datos/mailpit.db
    volumes:
      - mail:/datos
    ports:
      - "${MAIL_UI_PUERTO_HOST:-8025}:8025"

  # SMS SERVER :9004 (HTTP) · Máquina 3 · SMS GATEWAY
  sms:
    image: python:3.13-alpine
    command: ["python", "-I", "/app/servidor.py"]
    volumes:
      - ../sms/servidor.py:/app/servidor.py:ro
      - sms:/datos
    ports:
      - "${SMS_PUERTO_HOST:-9004}:9004"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9004/salud"]
      interval: 10s
      retries: 10

  # DB SERVER :5432 · DB NOTIFICACION · Máquina 2
  db-notificacion:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notificacion
      POSTGRES_USER: notificacion
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-notificacion:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificacion -d notificacion"]
      interval: 5s
      retries: 20

  # MSNotificacion SERVER :8089 · MSNotificacion.jar · Máquina 2
  msnotificacion:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: msnotificacion
        ARTEFACTO: MSNotificacion
        PUERTO: 8089
    environment:
      DB_URL: jdbc:postgresql://db-notificacion:5432/notificacion
      DB_USUARIO: notificacion
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      MAIL_HOST: mail
      MAIL_REMITENTE: ${MAIL_REMITENTE:?Falta MAIL_REMITENTE en deploy/dev/.env}
      RUTA_SMS: http://sms:9004
    depends_on:
      db-notificacion:
        condition: service_healthy
      mom:
        condition: service_healthy
      sms:
        condition: service_healthy

  # DB SERVER :5432 · DB PAGO · Máquina 3
  db-pago:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pago
      POSTGRES_USER: pago
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-pago:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pago -d pago"]
      interval: 5s
      retries: 20

  # MSPago SERVER :5086 · MSPago.dll (Kestrel .NET 8) · Máquina 3
  mspago:
    build:
      context: ../../services-dotnet
      dockerfile: Dockerfile
      args:
        PROYECTO: MSPago
        PUERTO: 5086
    environment:
      DB_HOST: db-pago
      DB_NOMBRE: pago
      DB_USUARIO: pago
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      MOM_HOST: mom
      MOM_USUARIO: ${RABBITMQ_USUARIO:?Falta RABBITMQ_USUARIO en deploy/dev/.env}
      MOM_CLAVE: ${RABBITMQ_CLAVE:?Falta RABBITMQ_CLAVE en deploy/dev/.env}
      TASA_IMPUESTO: ${TASA_IMPUESTO:?Falta TASA_IMPUESTO en deploy/dev/.env}
      RUTA_YOPAGO: http://yopagobackend:5001
      URL_PAGO: ${URL_PAGO:?Falta URL_PAGO en deploy/dev/.env}
    depends_on:
      db-pago:
        condition: service_healthy
      mom:
        condition: service_healthy

  # DB SERVER :5432 · DB YOPAGO · Máquina 3
  db-yopago:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yopago
      POSTGRES_USER: yopago
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
    volumes:
      - db-yopago:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yopago -d yopago"]
      interval: 5s
      retries: 20

  # YoPago SERVER :5001 · YoPagoBackEnd.dll (Kestrel .NET 8) · Máquina 3 · sistema externo
  yopagobackend:
    build:
      context: ../../services-dotnet
      dockerfile: Dockerfile
      args:
        PROYECTO: YoPagoBackEnd
        PUERTO: 5001
    environment:
      DB_HOST: db-yopago
      DB_NOMBRE: yopago
      DB_USUARIO: yopago
      DB_CLAVE: ${DB_CLAVE:?Falta DB_CLAVE en deploy/dev/.env}
      RUTA_SSO: https://balanceador:443
      CERTIFICADO_SSO: /run/secrets/certificado_sso
      CREDENCIAL_YOPAGO: ${CREDENCIAL_YOPAGO:?Falta CREDENCIAL_YOPAGO en deploy/dev/.env}
    secrets:
      - certificado_sso
    depends_on:
      db-yopago:
        condition: service_healthy

  # YoPagoWeb SERVER :5000 · YoPagoFrontEnd.dll (Kestrel .NET 8, MVC con Razor) · Máquina 1 (DMZ)
  yopagofrontend:
    build:
      context: ../../services-dotnet
      dockerfile: Dockerfile
      args:
        PROYECTO: YoPagoFrontEnd
        PUERTO: 5000
    environment:
      RUTA_YOPAGO: http://yopagobackend:5001
    ports:
      - "${YOPAGOWEB_PUERTO_HOST:-5000}:5000"

  # BALANCEADOR DE CARGAS :80 (Nginx) · Máquina 1 (DMZ)
  balanceador:
    image: nginx:1.29-alpine
    environment:
      SSOWEB: ssoweb:80
      APIGATEWAY: apigateway:8080
      MSCOMPRA_REPLICA1: mscompra-replica1:8085
      MSCOMPRA_REPLICA2: mscompra-replica2:8085
      RESOLVER: 127.0.0.11
    volumes:
      - ../balanceador/templates:/etc/nginx/templates:ro
      - ../secretos/balanceador.crt:/etc/nginx/tls/balanceador.crt:ro
      - ../secretos/balanceador.key:/etc/nginx/tls/balanceador.key:ro
    ports:
      - "${BALANCEADOR_PUERTO_HOST:-80}:80"
      - "${BALANCEADOR_HTTPS_PUERTO_HOST:-443}:443"
    depends_on:
      - apigateway

  # APIGATEWAY SERVER :8080 · APIGateway.jar · Máquina 1 (DMZ)
  apigateway:
    build:
      context: ../../services
      dockerfile: Dockerfile
      args:
        MODULO: apigateway
        ARTEFACTO: APIGateway
        PUERTO: 8080
    environment:
      RUTA_MSACCESO: http://msacceso:8081
      RUTA_MSCATALOGO: http://mscatalogo:8082
      RUTA_MSSUBASTA: http://mssubasta:8083
      RUTA_MSSUSCRIPCION: http://mssuscripcion:8084
      RUTA_BALANCEADOR_COMPRA: http://balanceador:8085
      RUTA_MSPAGO: http://mspago:5086
      TOKEN_CLAVE_PUBLICA: /run/secrets/token_publica
      CREDENCIAL_YOPAGO: ${CREDENCIAL_YOPAGO:?Falta CREDENCIAL_YOPAGO en deploy/dev/.env}
    secrets:
      - token_publica
    ports:
      - "${APIGATEWAY_PUERTO_HOST:-8080}:8080"
